muleVersion: "4.9.0"

http:
  listener:
    host: "0.0.0.0"
    port: "8081"
    basePath: "/api/"
    path: "v1/*"
    readTimeout: "30000"
    keystore:
      path: "certs/listener-cert.jks"
    connection:
      idealTimeout: "40000"

application:
  name: "email-notification-sapi"

health:
  check:
    subject: "Health Check Request"
    body: "This is a health check request"
    toAddress: "test@xyz.com"

email:
  reconnection:
    frequency: "3000"
    attempts: "5"
    
system:
  errors: "HTTP:BAD_GATEWAY, HTTP:CONNECTIVITY, HTTP:FORBIDDEN, HTTP:TIMEOUT, HTTP:SERVICE_UNAVAILABLE"
  
batch:
  job:
    maxFailed:
      records: "-1"
    block:
      size: "1200"
  step:
    one:
      aggregator:
        size: "600"
        
kafka:
  retry:
    frequency: "3000"
    attempts: "5"